<!DOCTYPE html>
<html lang="pt-BR"> <!-- a tag acima define a linguagem do site em questão para maior integração do navegador-->
<head> <!-- head define os metadados do site-->
    <title>Curso de Web Dev</title> <!-- title define o título que vai aparecer lá na guia em seu navegador-->
    <meta charset="UTF-8">     <!-- charset define a codificação do site. pt-BR utiliza UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- viewport define a responsividade do site-->
    <link rel="stylesheet" href="styles.css"> <!-- linka o arquivo CSS ao HTML-->
</head>
<body> <!-- body define o conteúdo do site-->
    <h1>Título 1</h1> <!-- a tag <h1> define títulos, indo até <h3> -->
    <p>Olá, mundo!</p> <!-- a tag <p> define um parágrafo-->    
    <nbsp>Este é um espaço não  quebrável.</nbsp> <!-- <nbsp> cria um espaço que obrigatoriamente será exibido na mesma linha>-->
    <p>Este &nbsp é &nbsp; um &nbsp; texto &nbsp;  separado</p> <!-- &nbsp; serve para criar um espaço vazio-->
    <p>Estes são caracteres especiais: &#33; &euro; &pound;  </p>
</body>
</html>
<!-- Comentário em HTML é feito desta forma. Lembre-se: comentários em HTML podem ser vistos pelos usuários. -->
